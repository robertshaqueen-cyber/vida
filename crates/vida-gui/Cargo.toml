[package]
name = "vida-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vida"
path = "src/main.rs"

[dependencies]
vida-core = { path = "../vida-core" }
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rfd = "0.17"

[dependencies.iced]
version = "= 0.14.0"
features = ["tokio", "wgpu", "advanced"]

[dev-dependencies]
winit = "0.30"
wgpu = "27"
pollster = "0.4"
raw-window-handle = "0.6"
objc = "0.2"
cosmic-text = "0.15"
fontdb = "0.23"
bytemuck = { version = "1", features = ["derive"] }
unicode-width = "0.2.2"

[[example]]
name = "wgpu_baseline"
path = "examples/wgpu_baseline.rs"

[[example]]
name = "term_grid"
path = "examples/term_grid.rs"
