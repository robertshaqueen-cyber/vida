[package]
name = "vida-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vida"
path = "src/main.rs"

[dependencies]
vida-core = { path = "../vida-core" }
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rfd = "0.17"
font-kit = "0.14.3"
pathfinder_geometry = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9.4"
core-graphics = "0.23.2"
core-text = "20.1.0"

[dependencies.iced]
version = "= 0.14.0"
features = ["tokio", "wgpu", "advanced"]

[dependencies.cosmic-text]
version = "0.15"
default-features = false
features = ["std", "swash"]

[dependencies.fontdb]
version = "0.23"
default-features = false
features = ["std", "fs"]

[dependencies.bytemuck]
version = "1"
features = ["derive"]

[dependencies.iced_wgpu]
version = "= 0.14.0"

[dependencies.wgpu]
version = "27"

[dependencies.iced_graphics]
version = "= 0.14.0"

[dev-dependencies]
winit = "0.30"
wgpu = "27"
pollster = "0.4"
raw-window-handle = "0.6"
objc = "0.2"
unicode-width = "0.2.2"

[[example]]
name = "wgpu_baseline"
path = "examples/wgpu_baseline.rs"

[[example]]
name = "term_grid"
path = "examples/term_grid.rs"
